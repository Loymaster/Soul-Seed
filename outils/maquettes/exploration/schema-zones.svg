<text x="40" y="1282" font-size="18" fill="#5b4b33">Lecture : chaque cercle est un écran (une image de décor) ; le numéro est celui du décor public/assets/decors/exploration/NN-*.png.</text>
<text x="40" y="1310" font-size="18" fill="#5b4b33">Seule la topologie (qui mène où) est imposée ; la position et les distances sont libres. « (fin) » = cul-de-sac ; « (eau) » = on peut y pêcher.</text>
<text x="40" y="1338" font-size="18" fill="#5b4b33">La Sortie du village (1) est reliée au ranch et au village. La caverne s’ouvre au Passage proche de la caverne (11) et court sous les monts.</text>
<text x="40" y="1366" font-size="18" fill="#5b4b33">Fins de chemin : 6 dans la cabane · 15 falaise sans issue · 17 forêt détruite · 23 vers la jungle (à venir) · 27 sans issue · 30 arène du cristal en fusion.</text>
